{% extends "base.html" %}
{% block title %}Search | {{ site.name }}{% endblock %}
{% block content %}
<h1>Search</h1>
<p id="search-status" class="fm-search-status" role="status" aria-live="polite">Loading search results…</p>
<div id="search-results"></div>
{% endblock %}
{% block scripts %}
<script>
(async () => {
    const query = new URLSearchParams(window.location.search).get('q')?.trim() || '';
    const status = document.getElementById('search-status');
    const results = document.getElementById('search-results');
    const input = document.querySelector('.fm-search-form input[name="q"]');
    if (input) input.value = query;
    if (!query) {
        status.textContent = 'Enter a search term above.';
        return;
    }

    const terms = query.toLocaleLowerCase().split(/\s+/).filter(Boolean);
    try {
        const response = await fetch('{% if site.base_url %}{{ site.base_url }}{% endif %}/search/entries.json');
        if (!response.ok) throw new Error('Search index unavailable');
        const entries = await response.json();
        const matches = entries.map(entry => {
            const title = String(entry.title || 'Untitled');
            const text = String(entry.text || '');
            const titleLower = title.toLocaleLowerCase();
            const textLower = text.toLocaleLowerCase();
            if (!terms.every(term => titleLower.includes(term) || textLower.includes(term))) return null;
            return { entry, title, text, score: terms.reduce((score, term) =>
                score + (titleLower.includes(term) ? 3 : 0) + (textLower.includes(term) ? 1 : 0), 0) };
        }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 50);

        status.textContent = matches.length ? `${matches.length} result${matches.length === 1 ? '' : 's'} for “${query}”` : `No results for “${query}”.`;
        for (const match of matches) {
            const article = document.createElement('article');
            article.className = 'fm-search-result';
            const heading = document.createElement('h2');
            const link = document.createElement('a');
            link.href = match.entry.url;
            highlight(link, match.title, terms);
            heading.append(link);
            const excerpt = document.createElement('p');
            const lower = match.text.toLocaleLowerCase();
            const positions = terms.map(term => lower.indexOf(term)).filter(index => index >= 0);
            const start = Math.max(0, (positions.length ? Math.min(...positions) : 0) - 65);
            const snippet = match.text.slice(start, start + 210).trim();
            if (start > 0) excerpt.append('…');
            highlight(excerpt, snippet, terms);
            if (start + 210 < match.text.length) excerpt.append('…');
            article.append(heading, excerpt);
            results.append(article);
        }
    } catch (error) {
        status.textContent = 'Search is unavailable right now. Please try again later.';
    }

    function highlight(container, value, words) {
        const pattern = new RegExp(words.map(word => word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'gi');
        let position = 0;
        for (const match of value.matchAll(pattern)) {
            container.append(document.createTextNode(value.slice(position, match.index)));
            const mark = document.createElement('mark');
            mark.textContent = match[0];
            container.append(mark);
            position = match.index + match[0].length;
        }
        container.append(document.createTextNode(value.slice(position)));
    }
})();
</script>
{% endblock %}
