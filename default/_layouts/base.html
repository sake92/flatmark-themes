<!DOCTYPE html>
<html lang="{{ page.lang.code }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="{{ page.description }}">
    <title>{% block title %}{{ page.title }} | {{ site.name }}{% endblock %}</title>
    <link rel="shortcut icon" href="/images/favicon.png" type="image/png">
    {% if site.code_highlight.enabled %}
    <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/a11y-dark.min.css" media="(prefers-color-scheme: dark)" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/a11y-light.min.css" media="(prefers-color-scheme: light), (prefers-color-scheme: no-preference)" rel="stylesheet">
    {% endif %}
    {% if site.math_highlight.enabled %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
    {% endif %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.conditional.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/default.css">
</head>
<body>
{% include "header.html" %}
<main class="pico container fm-main">
    <div class="fm-layout">
        <div class="fm-content">
            {% block content %}{% endblock %}
        </div>
        {% if page.toc|length > 0 %}
        <aside class="fm-toc" aria-label="On this page">
            {% include "toc.html" %}
        </aside>
        {% endif %}
    </div>
</main>
{% include "footer.html" %}
{% block scripts %}{% endblock %}
<script>
if (window.matchMedia('(max-width: 850px)').matches) {
    document.querySelectorAll('.fm-toc-details').forEach(details => { details.open = false; });
}

for (const code of document.querySelectorAll('.fm-content pre > code')) {
    const pre = code.parentElement;
    const wrapper = document.createElement('div');
    wrapper.className = 'fm-code-block';
    pre.before(wrapper);
    wrapper.append(pre);

    const toolbar = document.createElement('div');
    wrapper.append(toolbar);
    const languageClass = [...code.classList].find(name => name.startsWith('language-'));
    if (languageClass) {
        const label = document.createElement('span');
        label.textContent = languageClass.slice('language-'.length);
        toolbar.append(label);
    }

    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'secondary outline';
    button.textContent = 'Copy';
    button.setAttribute('aria-label', 'Copy code to clipboard');
    toolbar.append(button);

    const reserveSpace = () => {
        pre.style.paddingRight = `${Math.ceil(toolbar.getBoundingClientRect().width) + 18}px`;
    };
    reserveSpace();

    let resetTimeout;
    button.addEventListener('click', async () => {
        try {
            if (navigator.clipboard?.writeText) {
                await navigator.clipboard.writeText(code.textContent);
            } else {
                const selection = window.getSelection();
                const previousRange = selection.rangeCount ? selection.getRangeAt(0) : null;
                const range = document.createRange();
                range.selectNodeContents(code);
                selection.removeAllRanges();
                selection.addRange(range);
                try {
                    if (!document.execCommand('copy')) throw new Error('Copy failed');
                } finally {
                    selection.removeAllRanges();
                    if (previousRange) selection.addRange(previousRange);
                }
            }
            button.textContent = 'Copied!';
        } catch {
            button.textContent = 'Copy failed';
        }
        reserveSpace();
        clearTimeout(resetTimeout);
        resetTimeout = setTimeout(() => {
            button.textContent = 'Copy';
            reserveSpace();
        }, 2000);
    });
}
</script>
</body>
</html>
