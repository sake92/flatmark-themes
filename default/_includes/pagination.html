

<aside>
    <nav>
        <ul>
        {% for item in paginator.items %}
        <li><a href="{{ item.url }}">{{ item.title }}</a></li>
        {% endfor %}
        </ul>
    </nav>

    {% if paginator.has_prev or paginator.has_next %}
    <nav class="fm-pagination" aria-label="Pagination">
        {% if paginator.has_prev %}
        <a href="{{ paginator.prev_url }}" role="button" class="secondary outline">Previous</a>
        {% endif %}
        <span aria-current="page">Page {{ paginator.current }}</span>
        {% if paginator.has_next %}
        <a href="{{ paginator.next_url }}" role="button" class="secondary outline">Next</a>
        {% endif %}
    </nav>
    {% endif %}

</aside>
